<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Attendance Tracker — policy tests</title>
<style>body{font:13px/1.5 ui-monospace,Consolas,monospace;margin:24px;white-space:pre-wrap}.f{color:#B42318;font-weight:bold}.p{color:#067647}</style></head>
<body><h1 style="font-family:system-ui">Attendance Tracker — policy engine tests</h1><div id="out"></div>
<script src="engine.js"></script><script src="store.js"></script><script src="tests.js"></script>
<script>const o=document.getElementById("out");runTests(m=>{const s=document.createElement("div");s.textContent=m;s.className=m.startsWith("FAIL")?"f":m.startsWith("PASS")?"p":"";o.append(s);});</script>
</body></html>
